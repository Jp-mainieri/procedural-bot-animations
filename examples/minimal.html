<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>procedural-bot-animations: minimal</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 1rem;
           font-family: system-ui, sans-serif; background: #fff; color: #111; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
    #bot { width: 240px; }
    button { font: inherit; padding: 0.4rem 0.8rem; }
  </style>
</head>
<body>
  <div id="bot"></div>
  <div>
    <button data-reaction="success">success</button>
    <button data-reaction="wink">wink</button>
    <button data-reaction="fright">fright</button>
  </div>
  <script type="module">
    import { mountCharacter, RIG_BERRY } from "../dist/index.js";

    // The character looks at the pointer by default (gaze: "pointer").
    const bot = mountCharacter(document.querySelector("#bot"), {
      rig: RIG_BERRY,
      color: "#e11d2e",
      label: "Berry, an animated mascot",
    });

    for (const button of document.querySelectorAll("[data-reaction]")) {
      button.addEventListener("click", () => bot.react(button.dataset.reaction));
    }
  </script>
</body>
</html>
