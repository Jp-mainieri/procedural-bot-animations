<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 900px;
    height: 320px;
    background: #f6f2ec;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .stage {
    width: 900px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
  }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .slot .bot { width: 170px; height: 170px; }
  .slot .caption { color: #8a8378; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="slot"><svg class="bot" id="bot-calm" viewBox="190 60 880 990"></svg><div class="caption">sleepy</div></div>
    <div class="slot"><svg class="bot" id="bot-eager" viewBox="190 60 880 990"></svg><div class="caption">curious</div></div>
    <div class="slot"><svg class="bot" id="bot-proud" viewBox="190 60 880 990"></svg><div class="caption">proud</div></div>
  </div>

<script type="module">
  // Three Berrys, the real engine (same exact rig + full BerryBrain: moods, gaze,
  // reactions, leaf physics — ported from DevBerry's lib/berry in berry-live.js),
  // each showing a different mood and a different real reaction from its catalog.
  import { mountBerry } from "../../../examples/berry-live/berry-live.js";

  const calm = mountBerry(document.getElementById("bot-calm"), { color: "#5b7a6b", interactive: false, gazeMode: "free" });
  calm.start();
  calm.setMood({ sleepy: 1 });
  setInterval(() => calm.react("flatten"), 4600);

  const eager = mountBerry(document.getElementById("bot-eager"), { color: "#ff6a1a", interactive: false, gazeMode: "free" });
  eager.start();
  eager.setMood({ curious: 1 });
  const eagerReactions = ["wink", "doubleHop", "peek"];
  let eagerStep = 0;
  setInterval(() => eager.react(eagerReactions[eagerStep++ % eagerReactions.length]), 1500);

  const proud = mountBerry(document.getElementById("bot-proud"), { color: "#3b6ea5", interactive: false, gazeMode: "free" });
  proud.start();
  proud.setMood({ proud: 1 });
  setInterval(() => proud.react("somersault"), 3200);

  window.__coverReady = true;
</script>
</body>
</html>
