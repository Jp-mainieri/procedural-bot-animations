name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - "examples/berry-live/**"
      - "skills/procedural-bot-animations/assets/cover.gif"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble pages artifact
        run: |
          mkdir -p pages-dist/berry-live
          cp -r site/. pages-dist/
          cp -r dist pages-dist/dist
          cp examples/berry-live/*.js pages-dist/berry-live/
          cp examples/berry-live/berry-demo.html pages-dist/berry-live/index.html
          cp skills/procedural-bot-animations/assets/cover.gif pages-dist/cover.gif
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
