<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural bot animations — Studio</title>
<meta name="description" content="Play with procedurally animated characters, then add your own characters and animations as JSON and see them move live." />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='22' rx='9' fill='%23e11d2e'/%3E%3Crect x='10' y='13' width='4' height='8' rx='2' fill='%230a0a0a'/%3E%3Crect x='18' y='13' width='4' height='8' rx='2' fill='%230a0a0a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./studio.css" />
</head>
<body>
<a class="skip" href="#panel-col">Skip to the panels</a>
<header class="top">
  <p class="brand">Procedural bot animations <span class="brand-sub">Studio</span></p>
  <a class="top-link" href="https://github.com/Jp-mainieri/procedural-bot-animations" target="_blank" rel="noopener">GitHub</a>
</header>
<main class="app">
  <div id="stage-col" class="stage-col"></div>
  <div id="panel-col" class="panel-col"></div>
</main>
<p id="loading" class="loading" role="status">Loading the Studio…</p>
<noscript><p class="loading">The Studio needs JavaScript to draw and animate the characters.</p></noscript>
<script>
  // Classic script on purpose: it still runs if the module graph fails to load (for example when dist/ is missing).
  setTimeout(function () {
    var el = document.getElementById("loading");
    if (el && document.body.dataset.ready !== "1")
      el.textContent = "The Studio could not start. When running it locally, build it with npm run site and serve the site folder over http.";
  }, 4000);
</script>
<script type="module" src="./studio.js"></script>
</body>
</html>
